[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-scoped-agents"
version = "0.1.0"
description = "Per-task capability tokens for AI agents: OAuth scopes, but for tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ingenious AI" }]
keywords = ["ai-agents", "least-privilege", "tool-calling", "security", "capability-tokens"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
task-scoped-agents = "task_scoped_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
